name: Grocery Buddy APK

on:
  push:
    paths:
      - 'grocery-app/**'
      - '.github/workflows/grocery-apk.yml'
  pull_request:
    paths:
      - 'grocery-app/**'
      - '.github/workflows/grocery-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grocery-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GroceryBuddy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GroceryBuddy-apk
          path: grocery-app/GroceryBuddy.apk
          if-no-files-found: error
